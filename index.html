<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B54">
<title>Roberto OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="app/styles.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><b>Roberto OS</b><span id="brandDate">—</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="rail-goal" id="railGoal"></div>
      <div class="gauge">
        <div class="gauge-t"><span id="gaugeLbl">Spațiu</span><span id="gaugeN">0 / 5000</span></div>
        <div class="gauge-bar"><i id="gaugeBar" style="width:0%"></i></div>
      </div>
      <div class="mode"><span class="dot" id="modeDot"></span><span id="modeTxt">se conectează…</span></div>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div id="layer"></div>
<script type="module" src="app/app.js"></script>
</body>
</html>
