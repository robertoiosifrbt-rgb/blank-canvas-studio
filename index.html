<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B54">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Roberto OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --surface-2:#EAEEE9; --surface-3:#E0E6DF;
  --line:#D6DDD6; --line-strong:#BCC6BC;
  --ink:#16201B; --ink-2:#57635C; --ink-3:#87938B;
  --accent:#0E6B54; --accent-ink:#0B5744; --accent-soft:#DCEDE6; --on-accent:#FFFFFF;
  --ochre:#9C6416; --ochre-soft:#F5E7D2;
  --good:#1B7F4B; --good-soft:#DBEFE2;
  --warn:#9A6608; --warn-soft:#F7E8CC;
  --bad:#A93B2B; --bad-soft:#F7DFDA;
  --shadow:0 1px 2px rgba(22,32,27,.06), 0 4px 14px rgba(22,32,27,.05);
  --radius:10px; --rail:236px;
  --f-sans:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#161E1A; --surface-2:#1D2723; --surface-3:#25302B;
    --line:#293430; --line-strong:#3A4741;
    --ink:#E6EBE7; --ink-2:#9CA9A2; --ink-3:#6D7B74;
    --accent:#3FBF95; --accent-ink:#5FD4AE; --accent-soft:#14332A; --on-accent:#08130F;
    --ochre:#D9A05B; --ochre-soft:#332614;
    --good:#4CC98A; --good-soft:#123326;
    --warn:#E0AE5A; --warn-soft:#332714;
    --bad:#E8735E; --bad-soft:#3A1F1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#161E1A; --surface-2:#1D2723; --surface-3:#25302B;
  --line:#293430; --line-strong:#3A4741;
  --ink:#E6EBE7; --ink-2:#9CA9A2; --ink-3:#6D7B74;
  --accent:#3FBF95; --accent-ink:#5FD4AE; --accent-soft:#14332A; --on-accent:#08130F;
  --ochre:#D9A05B; --ochre-soft:#332614;
  --good:#4CC98A; --good-soft:#123326;
  --warn:#E0AE5A; --warn-soft:#332714;
  --bad:#E8735E; --bad-soft:#3A1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav{padding:10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
.nav-h{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:14px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav a svg{flex:none;opacity:.85}
.nav a .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.nav a.on .cnt{color:var(--accent-ink)}
.rail-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.gauge{display:flex;flex-direction:column;gap:5px}
.gauge-t{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.gauge-bar{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.gauge-bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.mode{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.dot.local{background:var(--warn)}

main{min-width:0;padding:26px 30px 60px;max-width:1120px}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.head p{margin:3px 0 0;color:var(--ink-2);font-size:14px}
.head .sp{flex:1}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;border:1px solid transparent}
.btn:hover{background:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:var(--surface)}
.icon-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.del:hover{background:var(--bad-soft);color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:9px 11px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
label.fld{display:flex;flex-direction:column;gap:5px}
label.fld>span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px 18px}
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-h h2{margin:0;font-size:13px;font-family:var(--f-mono);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:30px 24px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 5px;font-size:16px;color:var(--ink);font-weight:600}
.empty p{margin:0 auto 16px;max-width:44ch;font-size:14px}
.demo{opacity:.45;pointer-events:none;user-select:none;margin-top:18px}
.demo-tag{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px;text-align:left}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.tile .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--f-mono);font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--ink-2)}
.tile.lead{border-left:3px solid var(--accent)}
.v.good{color:var(--good)} .v.bad{color:var(--bad)} .v.warn{color:var(--warn)}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row .main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.row .ttl{font-weight:500;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;white-space:nowrap}
.row.done .ttl{text-decoration:line-through;color:var(--ink-3);text-decoration-color:var(--ink-3)}
.chk{width:19px;height:19px;flex:none;border:1.5px solid var(--line-strong);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:transparent;background:var(--surface)}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stripe{width:3px;align-self:stretch;border-radius:2px;flex:none;background:var(--line-strong)}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.good{background:var(--good)}

/* ---------- bars / charts ---------- */
.prog{display:block;height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.prog i.good{background:var(--good)} .prog i.warn{background:var(--warn)} .prog i.bad{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:7px;height:96px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;align-items:center;height:100%}
.bars .b .pair{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars .b i{display:block;flex:1;max-width:16px;border-radius:2px 2px 0 0;min-height:2px}
.bars .b i.in{background:var(--good)} .bars .b i.out{background:var(--bad);opacity:.75}
.bars .b em{font-family:var(--f-mono);font-size:9.5px;font-style:normal;color:var(--ink-3);letter-spacing:.04em}
.legend{display:flex;gap:14px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.legend b s{width:8px;height:8px;border-radius:2px;display:block}

/* ---------- habits ---------- */
.hgrid{display:flex;gap:3px}
.hcell{width:15px;height:15px;border-radius:3px;background:var(--surface-3);border:none;padding:0}
.hcell.on{background:var(--accent)}
.hcell.today{box-shadow:0 0 0 1.5px var(--ink-3)}
.hcell.on.today{box-shadow:0 0 0 1.5px var(--accent-ink)}
.hcell:hover{opacity:.75}
.hlabels{display:flex;gap:3px;margin-top:4px}
.hlabels em{width:15px;text-align:center;font-family:var(--f-mono);font-size:9px;font-style:normal;color:var(--ink-3)}
.streak{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ochre);white-space:nowrap}

/* ---------- notes ---------- */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:7px;text-align:left;align-items:stretch}
.note:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.note h4{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.note p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note time{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- toolbar ---------- */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1;min-width:150px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(12,20,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.28);width:100%;max-width:460px}
.modal header{padding:17px 20px 0;display:flex;align-items:center;gap:12px}
.modal header h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em;flex:1}
.modal .body{padding:16px 20px;display:flex;flex-direction:column;gap:13px}
.modal footer{padding:0 20px 18px;display:flex;gap:9px;justify-content:flex-end}
.alert{display:flex;align-items:flex-start;gap:11px;padding:12px 15px;border-radius:10px;margin-bottom:16px;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.alert svg{flex:none;margin-top:2px}
.alert .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.alert .txt b{display:block;font-size:14px;margin-bottom:2px}
.alert .go{align-self:center;white-space:nowrap}
.lim{display:flex;flex-direction:column;gap:6px;padding:13px 0;border-bottom:1px solid var(--line)}
.lim:last-child{border-bottom:none;padding-bottom:0}
.lim-t{display:flex;align-items:baseline;gap:10px}
.lim-t b{font-size:14px;font-weight:600;flex:1}
.lim-t span{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.lim p{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:6px}
.heroes .hero{margin-bottom:0;height:100%}
.strips{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.strips .strip{flex:1 1 240px;margin-bottom:0}
.rail-one{display:flex;flex-direction:column;gap:4px}
.rail-one+.rail-one{margin-top:9px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.hero{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:19px 21px;display:flex;flex-direction:column;gap:14px;margin-bottom:6px}
.hero-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .cur{font-family:var(--f-mono);font-size:33px;font-weight:600;color:var(--accent-ink);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.hero .of{font-size:13.5px;color:var(--ink-2)}
.hero .pc{margin-left:auto;font-family:var(--f-mono);font-size:25px;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hero-name{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);opacity:.8}
.hero-bar{height:9px;background:var(--surface);border-radius:5px;overflow:hidden}
.hero-bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hero-facts{display:flex;gap:26px;flex-wrap:wrap}
.hero-facts div{display:flex;flex-direction:column;gap:1px}
.hero-facts b{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hero-facts span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.strip{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;margin-bottom:18px;width:100%;text-align:left}
.strip:hover{border-color:var(--accent)}
.strip .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.strip .prog{flex:1;min-width:50px}
.strip .v{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--accent-ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail-goal{display:flex;flex-direction:column;gap:5px}
.goal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.goal-card.main{border-color:var(--accent)}
.goal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.goal-head h4{margin:0;font-size:16px;font-weight:600;flex:1;min-width:120px;overflow-wrap:anywhere}
.sheet-i{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:9px;color:var(--ink-2);font-size:15px;font-weight:500;text-align:left;width:100%}
.sheet-i:hover{background:var(--surface-2);color:var(--ink)}
.sheet-i.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav a.only-mob{display:none}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hname{flex:1 1 auto;min-width:130px;display:flex;flex-direction:column;gap:2px}
.hname b{font-weight:600;overflow-wrap:anywhere}
.hname em{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:14px;font-weight:500;z-index:80;box-shadow:var(--shadow)}

/* ---------- mobile ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
  .brand,.rail-foot,.nav-h{display:none}
  .nav{flex-direction:row;padding:5px 4px;gap:2px;overflow:visible;width:100%}
  .nav a{flex:1;min-width:0;flex-direction:column;gap:3px;font-size:10px;padding:8px 2px;font-weight:500;text-align:center;border-radius:9px}
  .nav a>span:not(.cnt){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .nav a:not(.mob):not(.only-mob){display:none}
  .nav a.only-mob{display:flex}
  .nav a .cnt{position:absolute;top:2px;left:50%;margin-left:4px;font-size:9.5px;line-height:1.5;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:0 5px;font-weight:600}
  main{padding:18px 14px calc(88px + env(safe-area-inset-bottom,0px))}
  .head{flex-direction:column;align-items:stretch;gap:13px;margin-bottom:18px}
  .head .sp{display:none}
  .head h1{font-size:22px}
  .head .btn{width:100%;justify-content:center;padding:12px 14px}
  .grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:12px 13px}
  .tile .v{font-size:19px}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{font-size:16px;padding:11px 12px}

  warn:'<path d="M8 2.4L14.6 13.4H1.4z"/><path d="M8 6.6v3.1M8 11.6v.1"/>'
};
function svg(n,s){return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[n]||"")+'</svg>';}

const CURRENCIES = {"£":"Liră (£)","€":"Euro (€)","RON":"Leu (RON)","$":"Dolar ($)"};
const CATS_OUT = ["Casă","Mâncare","Transport","Sănătate","Familie","Business","Abonamente","Distracție","Altele"];
const CATS_IN  = ["Salariu","Business","Cadou","Vânzare","Altele"];
const MONTHS = ["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
const MONTHS_L = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
const DAYS = ["D","L","Ma","Mi","J","V","S"];

/* ══════════ 2. Utilitare ══════════ */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => { const x = d?new Date(d):new Date(); return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const today = () => iso();
const ym = s => (s||today()).slice(0,7);
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; };
function money(n){
  const c = state.settings.currency || "£";
  const v = Math.abs(n).toLocaleString("ro-RO",{minimumFractionDigits:2,maximumFractionDigits:2});
  const s = n<0 ? "−" : "";
  return c==="RON" ? s+v+" RON" : s+c+v;
}
function dLabel(d){
  if(!d) return "";
  const t = today();
  if(d===t) return "azi";
  const y = new Date(); y.setDate(y.getDate()+1);
  if(d===iso(y)) return "mâine";
  const p = new Date(); p.setDate(p.getDate()-1);
  if(d===iso(p)) return "ieri";
  const dt = new Date(d+"T12:00:00");
  return dt.getDate()+" "+MONTHS[dt.getMonth()]+(dt.getFullYear()!==new Date().getFullYear()?" "+dt.getFullYear():"");
}
const daysTo = d => Math.round((new Date(d+"T12:00:00") - new Date(today()+"T12:00:00"))/864e5);
const isPhone = () => window.matchMedia("(max-width:860px)").matches;
function zile(n){ return n === 1 ? "1 zi" : n + ((n % 100 >= 20 || n === 0) ? " de zile" : " zile"); }
function toast(msg){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

/* ══════════ 3. Cloud, prin state-api ══════════ */
/* Aceeași funcție Edge pe care o folosește Life OS. Fără cheie Supabase:
   autentificarea se face cu x-device-token, exact ca în src/cloudState.ts. */
const STATE_API = "https://xmhvkgoxhoiuiigimied.supabase.co/functions/v1/state-api";
const TOKEN_KEY = "pushDeviceToken";  /* aceeași cheie ca aplicația existentă */
const SLOT = "roberto-os-v1";         /* sertar propriu, separat de restul */

const Cloud = {
  token:"",
  init(){
    try{
      let t = localStorage.getItem(TOKEN_KEY);
      if(!t){
        t = (crypto.randomUUID() + crypto.randomUUID()).replace(/-/g, "");
        localStorage.setItem(TOKEN_KEY, t);
      }
      this.token = t;
    }catch(e){ this.token = ""; }
    return !!this.token;
  },
  setToken(t){
    this.token = (t || "").trim();
    try{ localStorage.setItem(TOKEN_KEY, this.token); }catch(e){}
  },
  async call(body){
    const r = await fetch(STATE_API, {
      method:"POST",
      headers:{"Content-Type":"application/json", "x-device-token":this.token},
      body:JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.error || ("eroare " + r.status));
    return d;
  },
  payloadOf(d){ return (d && d.state && d.state.payload) || {}; },
  /* Citește doar sertarul nostru din payload-ul comun. */
  async load(){
    const raw = this.payloadOf(await this.call({action:"load"}))[SLOT];
    return raw ? JSON.parse(raw) : null;
  },
  /* Rescrie payload-ul întreg, cu sertarul nostru înlocuit — ca să nu
     ștergem cheile aplicației existente (tasks, calendarEvents, ...). */
  async save(data){
    const payload = Object.assign({}, this.payloadOf(await this.call({action:"load"})));
    payload[SLOT] = JSON.stringify(data);
    await this.call({action:"save", payload});
  }
};

/* ══════════ 3. Depozit (cloud, state-api sau local) ══════════ */
const COLLS = ["modules","tasks","notes","habits","debts","finance","goals","settings"];
const LS_KEY = "roberto_os_v1";
const LS_OLD = "achu_life_os_v1";

const state = {
  modules:{}, tasks:{}, notes:{}, habits:{}, debts:{}, finance:{}, goals:{},
  settings:{currency:"£"},
  view:"azi", ready:false
};

const Store = {
  db:null, mode:"local",
  async init(){
    /* 1. baza de date a Artifact-ului, când rulează acolo */
    try{
      if(window.claude && typeof window.claude.use === "function"){
        const db = await window.claude.use("db");
        if(db){ this.db = db; this.mode = "cloud"; }
      }
    }catch(e){}
    /* 2. altfel state-api — aceeași funcție Edge ca Life OS */
    if(this.mode !== "cloud" && Cloud.init()){
      this.loadLocal();          /* arată imediat ce e pe aparat */
      paintMode();
      try{
        const d = await Cloud.load();
        if(d){
          COLLS.forEach(c => { if(c !== "settings" && d[c]) state[c] = d[c]; });
          if(d.settings) state.settings = Object.assign({currency:"£"}, d.settings);
        } else {
          await Cloud.save(this.snapshot());   /* prima dată: urcă ce ai local */
        }
        this.mode = "state";
      }catch(e){
        this.err = (e && e.message) || "conectare eșuată";
      }
      state.ready = true; paintMode(); render();
      return;
    }
    if(this.mode === "cloud") this.watch(); else this.loadLocal();
    paintMode();
  },
  snapshot(){
    const d = {settings:state.settings};
    COLLS.forEach(c => { if(c !== "settings") d[c] = state[c]; });
    return d;
  },
  pushCloud(){
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      Cloud.save(this.snapshot()).catch(e => toast("Nu s-a salvat în cloud: " + ((e && e.message) || "eroare")));
    }, 700);
  },
  watch(){
    COLLS.forEach(c => {
      try{
        this.db.collection(c).onSnapshot(snap => {
          const bag = {};
          snap.docs.forEach(d => { if(d.exists) bag[d.id] = d.data(); });
          if(c === "settings"){ state.settings = Object.assign({currency:"£"}, bag.app || {}); }
          else state[c] = bag;
          state.ready = true; render();
        }, err => {
          if(err && err.code === "revoked"){ this.mode="local"; paintMode(); }
          state.ready = true; render();
        });
      }catch(e){}
    });
    setTimeout(()=>{ if(!state.ready){ state.ready = true; render(); } }, 2500);
  },
  loadLocal(){
    try{
      let raw = localStorage.getItem(LS_KEY);
      if(!raw){
        const old = localStorage.getItem(LS_OLD);
        if(old){ localStorage.setItem(LS_KEY, old); localStorage.removeItem(LS_OLD); raw = old; }
      }
      if(raw){
        const d = JSON.parse(raw);
        COLLS.forEach(c => { if(c!=="settings" && d[c]) state[c] = d[c]; });
        if(d.settings) state.settings = Object.assign({currency:"£"}, d.settings);
      }
    }catch(e){}
    state.ready = true;
    this.seed();
  },
  /* Cele două ancore, puse o singură dată. Dacă le ștergi, nu revin. */
  seed(){
    if(state.settings.seeded) return;
    const now = new Date().toISOString();
    if(!Object.keys(state.goals).length){
      state.goals = {
        g100k: {mod:"goals", name:"100k", kind:"sum", target:100000, due:"", main:true,
                habits:[], contrib:[], createdAt:now},
        gshape: {mod:"goals", name:"My best shape", kind:"metric", unit:"%", due:"", main:true,
                habits:[], reads:[], createdAt:now}
      };
    }
    state.settings = Object.assign({}, state.settings, {seeded:true});
  },
  saveLocal(){
    try{
      const d = {settings:state.settings};
      COLLS.forEach(c => { if(c!=="settings") d[c] = state[c]; });
      localStorage.setItem(LS_KEY, JSON.stringify(d));
    }catch(e){ toast("Nu am putut salva local — memoria browserului e plină sau blocată."); }
  },
  async put(coll, id, obj){
    if(coll === "settings"){ state.settings = obj; } else { state[coll] = Object.assign({}, state[coll]); state[coll][id] = obj; }
    render();
    if(this.mode === "cloud"){
      try{ await this.db.collection(coll).doc(id).set(obj); }
      catch(e){
        const c = e && e.code;
        toast(c === "quota_exceeded" ? "Nu mai încap fișe noi. Exportă și șterge din Setări → Limite."
            : c === "invalid_argument" ? "Fișa a depășit 256 KB. Vezi Setări → Limite ca să afli care e."
            : c === "resource_exhausted" ? "Prea multe salvări deodată. Așteaptă câteva secunde."
            : "Nu s-a salvat. Verifică internetul.");
      }
    } else if(this.mode === "state"){ this.saveLocal(); this.pushCloud(); }
    else this.saveLocal();
  },
  async drop(coll, id){
    if(state[coll]){ state[coll] = Object.assign({}, state[coll]); delete state[coll][id]; }
    render();
    if(this.mode === "cloud"){ try{ await this.db.collection(coll).doc(id).delete(); }catch(e){ toast("Nu s-a șters. Verifică internetul."); } }
    else if(this.mode === "state"){ this.saveLocal(); this.pushCloud(); }
    else this.saveLocal();
  },
  setSettings(patch){ return this.put("settings","app", Object.assign({}, state.settings, patch)); },
  count(){
    let n = 0;
    COLLS.forEach(c => { if(c!=="settings") n += Object.keys(state[c]||{}).length; });
    return n + 1;
  }
};

/* ══════════ 3b. Limite ══════════ */
const DOCS_MAX = 5000;          /* fișe în baza de date a aplicației */
const DOC_MAX  = 262144;        /* 256 KiB per fișă */
const LS_MAX   = 5000000;       /* spațiul din browser, aproximativ */
const bytes = str => { try{ return new TextEncoder().encode(str).length; }catch(e){ return str.length; } };
const kb = n => (n/1024).toFixed(n < 10240 ? 1 : 0) + " KB";

function docLabel(coll, doc, id){
  if(coll === "finance"){ const m = parseInt(id.slice(5,7),10)-1; return "luna " + (MONTHS_L[m]||id) + " " + id.slice(0,4); }
  return doc.name || doc.title || (coll === "tasks" ? doc.title : "") || id;
}
function biggestDoc(){
  let best = null;
  COLLS.forEach(c => {
    if(c === "settings") return;
    Object.keys(state[c] || {}).forEach(id => {
      const size = bytes(JSON.stringify(state[c][id]));
      if(!best || size > best.size) best = {size, coll:c, id, label:docLabel(c, state[c][id], id)};
    });
  });
  return best;
}
function limits(){
  const out = [];
  const docs = Store.count();
  out.push({key:"docs", label:"Fișe în bază", used:docs, max:DOCS_MAX,
    show:docs.toLocaleString("ro-RO") + " / " + DOCS_MAX.toLocaleString("ro-RO"),
    why:"Fiecare task, notiță, obicei, datorie sau lună de finanțe e o fișă.",
    fix:"Exportă și șterge ce nu-ți mai trebuie."});
  const big = biggestDoc();
  if(big) out.push({key:"doc", label:"Cea mai mare fișă", used:big.size, max:DOC_MAX,
    show:kb(big.size) + " / 256 KB", detail:big.label,
    why:"O singură fișă nu poate depăși 256 KB. „" + big.label + "” e cea mai plină.",
    fix: big.coll === "finance" ? "Șterge mișcări vechi din luna aceea."
       : big.coll === "habits"  ? "Bifele de zeci de ani se adună — șterge obiceiul vechi și fă-l din nou."
       : "Scurtează conținutul sau împarte-l în două."});
  if(Store.mode !== "cloud"){   /* și în modul state datele stau oglindite local */
    let used = 0;
    try{ used = bytes(localStorage.getItem(LS_KEY) || ""); }catch(e){}
    out.push({key:"ls", label:"Spațiu în browser", used, max:LS_MAX, show:kb(used) + " / ~5 MB",
      why:"Fără sincronizare, tot ce salvezi stă în browserul acestui aparat.",
      fix:"Exportă acum. Dacă se umple, browserul refuză să mai salveze."});
  }
  out.forEach(l => l.pct = Math.min(100, l.used/l.max*100));
  return out;
}
const worstLimit = () => limits().sort((a,b) => b.pct - a.pct)[0];
function limitBanner(){
  const w = worstLimit();
  if(!w || w.pct < 75) return "";
  const bad = w.pct >= 90;
  return '<div class="alert '+(bad?"bad":"warn")+'">'+svg("warn")+
    '<span class="txt"><b>'+(bad ? "Aproape plin: " : "Te apropii de o limită: ")+esc(w.label.toLowerCase())+' — '+w.pct.toFixed(0)+'%</b>'+
    esc(w.why)+' '+esc(w.fix)+'</span>' +
    '<button class="btn ghost sm go" data-a="go" data-i="__set">Vezi limitele</button></div>';
}

/* ══════════ 4. Module ══════════ */
function modules(){
  const custom = Object.keys(state.modules).map(id => Object.assign({id}, state.modules[id]))
    .sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
  return BUILTIN.concat(custom);
}
const modById = id => modules().find(m => m.id === id);
function itemsOf(coll, modId){
  return Object.keys(state[coll]||{})
    .map(id => Object.assign({id}, state[coll][id]))
    .filter(x => (x.mod || "") === modId);
}
</script>

<script>
"use strict";
const ui = { month: ym(), taskFilter:"open", search:"" };
