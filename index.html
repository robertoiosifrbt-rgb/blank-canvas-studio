  $("#modeDot").className = "dot" + (ok ? "" : " local");
  $("#modeTxt").textContent = m === "state" ? "sincronizat · cloud propriu"
    : m === "cloud" ? "sincronizat"
    : Store.err ? "cloud indisponibil" : "doar pe acest aparat";
  $("#modeTxt").title = m === "state"
    ? "Datele se salvează prin state-api, în baza ta de date."
    : ok ? "Datele se salvează în cloud și le vezi de pe orice aparat."
    : (Store.err ? "Nu s-a putut conecta: " + Store.err + ". " : "") +
      "Datele stau doar în acest browser. Exportă-le regulat din Setări.";
}
function paintRailGoal(){
  const box = $("#railGoal"), a = anchors();
  box.innerHTML = a.map(g => {
    const pct = gPct(g), ready = gHasTarget(g);
    return '<div class="rail-one"><div class="gauge-t"><span>'+esc(g.name)+'</span><span>'+(ready?pct.toFixed(0)+'%':'—')+'</span></div>' +
      '<div class="gauge-bar"><i style="width:'+Math.max(pct,1.5)+'%"></i></div>' +
      '<div class="gauge-t"><span class="num" style="letter-spacing:0;text-transform:none">'+
        (ready ? gFmt(g, gCur(g)) + ' / ' + gFmt(g, num(g.target)) : 'de completat') + '</span></div></div>';
  }).join("");
}
function paintGauge(){
  const w = worstLimit();
  if(!w) return;
  $("#gaugeN").textContent = w.show;
  $("#gaugeBar").style.width = Math.max(1.5, w.pct) + "%";
  $("#gaugeBar").style.background = w.pct >= 90 ? "var(--bad)" : w.pct >= 75 ? "var(--warn)" : "var(--accent)";
  const t = $("#gaugeLbl");
  if(t) t.textContent = w.label;
  $("#gaugeN").title = w.why + " " + w.fix;
}
const PIN = ["azi","goals","finante","taskuri"];
function renderNav(){
  const ms = modules();
  let h = '<div class="nav-h">Module</div>';
  ms.forEach(m => {
    let c = "";
    if(m.kind === "tasks")  c = itemsOf("tasks", m.id).filter(t => !t.done).length || "";
    if(m.kind === "notes")  c = itemsOf("notes", m.id).length || "";
    if(m.kind === "habits") c = itemsOf("habits", m.id).length || "";
    if(m.kind === "debts")  c = Object.keys(state.debts).filter(id => remaining(state.debts[id]) > 0).length || "";
    if(m.kind === "goals")  c = goalsAll().filter(g => (g.mod||"goals") === m.id).length || "";
    h += '<a href="#" data-a="go" data-i="'+m.id+'" class="'+(state.view===m.id?"on ":"")+(PIN.includes(m.id)?"mob":"")+'">'+svg(m.kind)+
         '<span>'+esc(m.name)+'</span>'+(c?'<span class="cnt num">'+c+'</span>':'')+'</a>';
  });
  h += '<div class="nav-h">Aplicație</div>' +
       '<a href="#" data-a="newmod">'+svg("plus")+'<span>Modul nou</span></a>' +
       '<a href="#" data-a="go" data-i="__set" class="'+(state.view==="__set"?"on":"")+'">'+svg("settings")+'<span>Setări</span></a>' +
       '<a href="#" data-a="more" class="only-mob '+(PIN.includes(state.view)?"":"on")+'">'+svg("more")+'<span>Mai mult</span></a>';
  $("#nav").innerHTML = h;
}
function render(){
  if(!state.ready){ $("#view").innerHTML = '<p style="color:var(--ink-3);font-family:var(--f-mono);font-size:12px">Se încarcă…</p>'; return; }
  renderNav(); paintGauge(); paintRailGoal();
  const d = new Date();
  $("#brandDate").textContent = d.getDate() + " " + MONTHS_L[d.getMonth()];
  const m = state.view === "__set" ? {kind:"settings"} : (modById(state.view) || BUILTIN[0]);
  const fns = {dashboard:viewDash, finance:viewFinance, debts:viewDebts, tasks:viewTasks, habits:viewHabits, notes:viewNotes, goals:viewGoals, settings:viewSettings};
  const body = (fns[m.kind] || viewDash)(m);
  $("#view").innerHTML = limitBanner() + (m.kind === "dashboard" || m.kind === "goals" ? "" : goalStrip()) + body;
}
function head(title, sub, actions){
  return '<div class="head"><div><h1>'+esc(title)+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="sp"></div>'+(actions||"")+'</div>';
}
function sec(t, extra){ return '<div class="sec-h"><h2>'+esc(t)+'</h2><div class="ln"></div>'+(extra||"")+'</div>'; }
function tile(k, v, s, cls, lead){
  return '<div class="tile'+(lead?" lead":"")+'"><span class="k">'+esc(k)+'</span><span class="v '+(cls||"")+'">'+v+'</span>'+(s?'<span class="s">'+s+'</span>':'')+'</div>';
}

/* ══════════ Finanțe: calcule ══════════ */
const monthItems = k => ((state.finance[k]||{}).items) || [];
function monthTotals(k){
  let inc = 0, out = 0;
  monthItems(k).forEach(t => { if(t.type === "in") inc += num(t.amount); else out += num(t.amount); });
  return {inc, out, bal: inc - out};
}
const remaining = d => Math.max(0, num(d.total) - (d.payments||[]).reduce((s,p) => s + num(p.amount), 0));
const paidOf = d => (d.payments||[]).reduce((s,p) => s + num(p.amount), 0);

/* ══════════ Obiective: calcule ══════════ */
/* Două feluri de obiectiv, măsurate diferit:
   sum    — se adună contribuții spre o țintă (bani). Ritmul vine din Finanțe.
   metric — o măsurătoare se mută de la un punct de plecare spre o țintă
            (kg, %, cm). Ritmul vine din propriile citiri.               */
const goalsAll = () => Object.keys(state.goals).map(id => Object.assign({id}, state.goals[id]));
const gKind = g => g.kind === "metric" ? "metric" : "sum";
const gUnit = g => g.unit || "";
const gFmt = (g, v) => {
  if(gKind(g) === "sum") return money(v);
  const u = gUnit(g), n = (Math.round(v*10)/10).toLocaleString("ro-RO");
  return u ? n + (u === "%" ? "" : " ") + u : n;
};
const gReads = g => (g.reads||[]).slice().sort((x,y) => (x.date||"").localeCompare(y.date||""));
const gHasTarget = g => g.target !== "" && g.target !== null && g.target !== undefined;
function gCur(g){
  if(gKind(g) === "sum") return (g.contrib||[]).reduce((s,c) => s + num(c.amount), 0);
  const r = gReads(g);
  return r.length ? num(r[r.length-1].value) : num(g.start);
}
function gPct(g){
  if(!gHasTarget(g)) return 0;
  if(gKind(g) === "sum") return num(g.target) ? Math.max(0, Math.min(100, gCur(g)/num(g.target)*100)) : 0;
  const st = num(g.start), tg = num(g.target), cur = gCur(g);
  if(tg === st) return cur === tg ? 100 : 0;
  return Math.max(0, Math.min(100, (cur - st)/(tg - st)*100));
}
const gDone = g => gHasTarget(g) && gPct(g) >= 100;
function anchors(){
  const all = goalsAll();
  const pinned = all.filter(g => g.main);
  if(pinned.length) return pinned.sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
  return all.length ? [all.slice().sort((a,b) => num(b.target)-num(a.target))[0]] : [];
}
/* ritmul banilor: media ultimelor 3 luni cu mișcări în Finanțe */
function paceRate(){
  const keys = []; const d = new Date();
  for(let i = 2; i >= 0; i--){ const x = new Date(d); x.setMonth(x.getMonth()-i); keys.push(iso(x).slice(0,7)); }
  const withData = keys.filter(k => monthItems(k).length);
  if(!withData.length) return null;
  return withData.reduce((s,k) => s + monthTotals(k).bal, 0) / withData.length;
}
/* ritmul unei măsurători: din prima și ultima citire */
function metricRate(g){
  const r = gReads(g);
  if(r.length < 2) return null;
  const f = r[0], l = r[r.length-1];
  const months = (new Date(l.date+"T12:00:00") - new Date(f.date+"T12:00:00"))/(864e5*30.44);
  if(months < 0.2) return null;
  return (num(l.value) - num(f.value))/months;
}
const monthsTo = due => {
  const a = new Date(), b2 = new Date(due+"T12:00:00");
  return (b2.getFullYear()-a.getFullYear())*12 + (b2.getMonth()-a.getMonth()) + (b2.getDate()-a.getDate())/30;
};
function whenAt(months){
  const d = new Date(); d.setDate(d.getDate() + Math.round(months * 30.44));
  return MONTHS[d.getMonth()] + " " + d.getFullYear();
}
/* consecvența obiceiurilor legate de obiectiv, pe 30 de zile */
function gStreakPct(g){
  const ids = (g.habits||[]).filter(id => state.habits[id]);
  if(!ids.length) return null;
  const days = []; const d = new Date();
  for(let i = 0; i < 30; i++){ const x = new Date(d); x.setDate(x.getDate()-i); days.push(iso(x)); }
  let hit = 0;
  ids.forEach(id => { const log = state.habits[id].log || {}; days.forEach(x => { if(log[x]) hit++; }); });
  return hit/(ids.length*30)*100;
}
function goalFacts(g, isAnchor){
  if(!gHasTarget(g)) return [];
  const out = [], cur = gCur(g), tgt = num(g.target);
  if(gKind(g) === "sum"){
    const rem = Math.max(0, tgt - cur);
    out.push({k:"Rămas", v:money(rem)});
    if(g.due && rem > 0){
      const m = monthsTo(g.due);
      out.push({k:"Necesar pe lună", v: m > 0 ? money(rem/m) : "termen depășit"});
    }
    const rate = isAnchor ? paceRate() : null;
    if(rem > 0 && rate !== null){
      out.push({k:"Ritmul tău", v:money(rate) + "/lună"});
      if(rate > 0) out.push({k:"Ajungi în", v:whenAt(rem/rate)});
    }
  } else {
    const rem = tgt - cur;
    out.push({k:"Rămas", v: Math.abs(rem) < 0.05 ? "atins" : gFmt(g, Math.abs(rem))});
    const rate = metricRate(g);
    if(rate !== null && Math.abs(rate) > 0.01){
      out.push({k:"Ritm", v:(rate > 0 ? "+" : "−") + gFmt(g, Math.abs(rate)) + "/lună"});
      if(Math.abs(rem) >= 0.05 && Math.sign(rate) === Math.sign(rem)) out.push({k:"Ajungi în", v:whenAt(rem/rate)});
    }
  }
  const cons = gStreakPct(g);
  if(cons !== null) out.push({k:"Consecvență 30z", v:cons.toFixed(0) + "%"});
  return out;
}
function goalStatus(g, isAnchor){
  if(!gHasTarget(g)) return {cls:"warn", txt:"de completat"};
  if(gDone(g)) return {cls:"good", txt:"atins"};
  if(gKind(g) === "sum"){
    const rate = isAnchor ? paceRate() : null;
    if(!g.due || rate === null) return null;
    const m = monthsTo(g.due), rem = Math.max(0, num(g.target) - gCur(g));
    if(m <= 0) return {cls:"bad", txt:"termen depășit"};
    return rate >= rem/m ? {cls:"good", txt:"în grafic"} : {cls:"warn", txt:"sub ritm"};
  }
  const rate = metricRate(g);
  if(rate === null) return null;
  const rem = num(g.target) - gCur(g);
  if(Math.sign(rate) !== Math.sign(rem)) return {cls:"bad", txt:"în direcția greșită"};
  if(!g.due) return {cls:"good", txt:"se mișcă"};
  const m = monthsTo(g.due);
  if(m <= 0) return {cls:"bad", txt:"termen depășit"};
  return Math.abs(rate) >= Math.abs(rem)/m ? {cls:"good", txt:"în grafic"} : {cls:"warn", txt:"sub ritm"};
}

/* ── panourile mari, unul per ancoră ── */
function goalHero(g, acts){
  const st = goalStatus(g, true), pct = gPct(g), ready = gHasTarget(g);
  let h = '<div class="hero"><span class="hero-name">'+esc(g.name)+
    (st?' · <span class="pill '+st.cls+'" style="vertical-align:middle">'+st.txt+'</span>':'')+'</span>';
  if(!ready){
    h += '<p style="margin:0;font-size:14px;color:var(--ink-2);line-height:1.55">Pune punctul de plecare și ținta, ca să pot urmări progresul și să-ți spun ritmul.</p>' +
      '<div><button class="btn sm" data-a="gedit" data-i="'+g.id+'">Completează</button></div></div>';
    return h;
  }
  h += '<div class="hero-top"><span class="cur">'+gFmt(g, gCur(g))+'</span>' +
    '<span class="of">'+(gKind(g)==="sum"?"din ":"→ ")+gFmt(g, num(g.target))+(g.due?' · până în '+dLabel(g.due):'')+'</span>' +
    '<span class="pc">'+pct.toFixed(pct < 10 ? 1 : 0)+'%</span></div>' +
    '<div class="hero-bar"><i style="width:'+Math.max(pct,0.8)+'%"></i></div>' +
    '<div class="hero-facts">' + goalFacts(g, true).map(f => '<div><b>'+f.v+'</b><span>'+esc(f.k)+'</span></div>').join("") + '</div>';
  if(acts) h += '<div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--accent);padding-top:12px">' +
    '<button class="btn sm" data-a="'+(gKind(g)==="sum"?"gcon":"gread")+'" data-i="'+g.id+'">'+svg("plus")+(gKind(g)==="sum"?"Contribuție":"Măsurătoare")+'</button>' +
    '<button class="btn ghost sm" data-a="gedit" data-i="'+g.id+'">Modifică</button>' +
    '<button class="icon-btn del" style="margin-left:auto" data-a="gdel" data-i="'+g.id+'" aria-label="Șterge">'+svg("trash")+'</button></div>';
  return h + '</div>';
}
function goalHeroes(acts){
  const a = anchors();
  if(!a.length) return '<button class="strip" data-a="go" data-i="goals"><span class="lbl">Obiective</span>' +
    '<span style="flex:1;font-size:13.5px;color:var(--ink-2)">Niciunul stabilit — pune țintele în jurul cărora se învârte tot.</span>' +
    '<span class="v">Stabilește →</span></button>';
  return '<div class="heroes">' + a.map(g => goalHero(g, acts)).join("") + '</div>';
}
function goalStrip(){
  const a = anchors();
  if(!a.length) return "";
  return '<div class="strips">' + a.map(g => {
    const pct = gPct(g), ready = gHasTarget(g);
    return '<button class="strip" data-a="go" data-i="goals" title="'+esc(g.name)+'">' +
      '<span class="lbl">'+esc(g.name)+'</span>' +
      '<span class="prog"><i style="width:'+Math.max(pct,0.8)+'%"></i></span>' +
      '<span class="v">'+(ready ? pct.toFixed(0)+'%' : 'de completat')+'</span></button>';
  }).join("") + '</div>';
}

/* ══════════ Panoul „Azi" ══════════ */
function viewDash(){
  const k = ym(), t = monthTotals(k), tod = today();
  const habits = Object.keys(state.habits).map(id => Object.assign({id}, state.habits[id]));
  const doneToday = habits.filter(h => (h.log||{})[tod]).length;
  const debts = Object.keys(state.debts).map(id => Object.assign({id}, state.debts[id])).filter(d => remaining(d) > 0);
  const debtLeft = debts.reduce((s,d) => s + remaining(d), 0);
  const tasks = Object.keys(state.tasks).map(id => Object.assign({id}, state.tasks[id]))
    .filter(x => !x.done && x.due && x.due <= tod)
    .sort((a,b) => (a.due||"").localeCompare(b.due||""));
  const soon = debts.filter(d => d.due).sort((a,b) => a.due.localeCompare(b.due)).slice(0,3);
  const dt = new Date();

  let h = head("Azi", esc(DAYS[dt.getDay()]==="D"?"duminică":["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"][dt.getDay()]) + ", " + dt.getDate() + " " + MONTHS_L[dt.getMonth()] + " " + dt.getFullYear());

  h += goalHeroes(false);
  h += '<div class="tiles">' +
    tile("Balanța lunii", money(t.bal), MONTHS_L[parseInt(k.slice(5,7),10)-1], t.bal < 0 ? "bad" : "good", true) +
    tile("Cheltuit luna asta", money(t.out), monthItems(k).length + " mișcări") +
    tile("Datorii rămase", money(debtLeft), debts.length ? debts.length + (debts.length===1?" datorie activă":" datorii active") : "nicio datorie") +
    tile("Obiceiuri azi", habits.length ? doneToday + "/" + habits.length : "—", habits.length ? (doneToday === habits.length ? "toate bifate" : (habits.length - doneToday) + (habits.length - doneToday === 1 ? " rămas" : " rămase")) : "niciunul definit", doneToday === habits.length && habits.length ? "good" : "") +
    '</div>';

  if(habits.length){
    h += sec("Obiceiuri de bifat");
    h += '<div class="rows">' + habits.map(hb => {
      const on = !!(hb.log||{})[tod];
      return '<div class="row"><button class="chk '+(on?"on":"")+'" data-a="tick" data-i="'+hb.id+'" data-d="'+tod+'" aria-label="Bifează '+esc(hb.name)+'">'+svg("check")+'</button>' +
        '<div class="main"><span class="ttl">'+esc(hb.name)+'</span></div>' +
        '<span class="streak">'+zile(streak(hb))+'</span></div>';
    }).join("") + '</div>';
  }

  h += sec("De făcut " + (tasks.length ? "" : "— nimic restant"));
  h += tasks.length ? '<div class="rows">' + tasks.map(taskRow).join("") + '</div>'
     : '<div class="card pad" style="color:var(--ink-2);font-size:14px">Niciun task scadent azi sau restant. '+(Object.keys(state.tasks).length?'':'Adaugă primul în modulul <b>Task-uri</b>.')+'</div>';

  if(soon.length){
    h += sec("Scadențe apropiate");
    h += '<div class="rows">' + soon.map(d => {
      const n = daysTo(d.due), cls = n < 0 ? "bad" : n <= 7 ? "warn" : "good";
      return '<div class="row"><span class="stripe '+cls+'"></span><div class="main"><span class="ttl">'+esc(d.name)+'</span>' +
        '<span class="sub">'+(n < 0 ? "restanță de " + zile(Math.abs(n)) : n === 0 ? "scadent azi" : "în " + zile(n))+' · '+dLabel(d.due)+'</span></div>' +
        '<span class="amt">'+money(remaining(d))+'</span></div>';
    }).join("") + '</div>';
  }
  return h;
}
function streak(hb){
  const log = hb.log || {}; let n = 0; const d = new Date();
  if(!log[iso(d)]) d.setDate(d.getDate()-1);
  while(log[iso(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ══════════ Finanțe ══════════ */
function viewFinance(m){
  const k = ui.month, t = monthTotals(k), items = monthItems(k).slice().sort((a,b) => (b.date||"").localeCompare(a.date||""));
  const mi = parseInt(k.slice(5,7),10) - 1, yr = k.slice(0,4);

  let h = head(m.name, "Cheltuielile sunt grupate pe luni — o singură fișă pe lună, oricâte mișcări.",
    '<button class="btn" data-a="fadd">'+svg("plus")+'Mișcare nouă</button>');

  h += '<div class="bar"><button class="btn ghost sm" data-a="fprev">‹</button>' +
       '<b style="min-width:150px;text-align:center;font-weight:600">'+MONTHS_L[mi]+" "+yr+'</b>' +
       '<button class="btn ghost sm" data-a="fnext">›</button>' +
       '<div class="grow"></div>' +
       (k !== ym() ? '<button class="btn ghost sm" data-a="fnow">Luna curentă</button>' : '') + '</div>';

  h += '<div class="tiles">' +
    tile("Venituri", money(t.inc), "", "good") +
    tile("Cheltuieli", money(t.out), "", "bad") +
    tile("Balanță", money(t.bal), t.bal >= 0 ? "ai rămas pe plus" : "ai ieșit pe minus", t.bal < 0 ? "bad" : "good", true) +
    '</div>';

  /* grafic ultimele 6 luni */
  const keys = []; const d0 = new Date(k + "-01T12:00:00");
  for(let i = 5; i >= 0; i--){ const d = new Date(d0); d.setMonth(d.getMonth() - i); keys.push(iso(d).slice(0,7)); }
  const tot = keys.map(monthTotals);
  const max = Math.max(1, ...tot.map(x => Math.max(x.inc, x.out)));
  if(tot.some(x => x.inc || x.out)){
    h += sec("Ultimele 6 luni", '<div class="legend"><b><s style="background:var(--good)"></s>venit</b><b><s style="background:var(--bad);opacity:.75"></s>cheltuit</b></div>');
    h += '<div class="card pad"><div class="bars">' + keys.map((kk,i) => {
      const a = tot[i];
      return '<div class="b" title="'+MONTHS_L[parseInt(kk.slice(5,7),10)-1]+': venit '+money(a.inc)+', cheltuit '+money(a.out)+'">' +
        '<div class="pair"><i class="in" style="height:'+(a.inc/max*100)+'%"></i><i class="out" style="height:'+(a.out/max*100)+'%"></i></div>' +
        '<em>'+MONTHS[parseInt(kk.slice(5,7),10)-1]+'</em></div>';
    }).join("") + '</div></div>';
  }

  /* categorii */
  const byCat = {};
  items.filter(x => x.type === "out").forEach(x => { byCat[x.cat||"Altele"] = (byCat[x.cat||"Altele"]||0) + num(x.amount); });
  const cats = Object.keys(byCat).sort((a,b) => byCat[b] - byCat[a]);
  if(cats.length){
    h += sec("Pe categorii");
    h += '<div class="rows">' + cats.map(c => {
      const v = byCat[c], pct = t.out ? v/t.out*100 : 0;
      return '<div class="row"><div class="main"><span class="ttl">'+esc(c)+'</span>' +
        '<div class="prog" style="margin-top:5px;max-width:260px"><i style="width:'+pct+'%"></i></div></div>' +
        '<span class="sub num" style="min-width:44px;text-align:right">'+pct.toFixed(0)+'%</span>' +
        '<span class="amt">'+money(v)+'</span></div>';
    }).join("") + '</div>';
  }

  h += sec("Mișcări în " + MONTHS_L[mi]);
  if(!items.length){
    h += '<div class="empty"><h3>Nicio mișcare în '+MONTHS_L[mi]+'</h3><p>Adaugă un venit sau o cheltuială și luna asta prinde viață. Totalurile și graficul se calculează singure.</p>' +
      '<button class="btn" data-a="fadd">'+svg("plus")+'Adaugă prima mișcare</button>' +
      '<div class="demo"><span class="demo-tag">Exemplu — așa va arăta</span><div class="rows">' +
      '<div class="row"><span class="stripe good"></span><div class="main"><span class="ttl">Factură client</span><span class="sub">Business · 3 '+MONTHS[mi]+'</span></div><span class="amt" style="color:var(--good)">+'+money(1200).replace("−","")+'</span></div>' +
      '<div class="row"><span class="stripe bad"></span><div class="main"><span class="ttl">Cumpărături</span><span class="sub">Mâncare · 5 '+MONTHS[mi]+'</span></div><span class="amt">−'+money(84.5).replace("−","")+'</span></div>' +
      '</div></div></div>';
  } else {
    h += '<div class="rows">' + items.map(x => {
      const inc = x.type === "in";
      return '<div class="row"><span class="stripe '+(inc?"good":"bad")+'"></span>' +
        '<div class="main"><span class="ttl">'+esc(x.note || (inc?"Venit":"Cheltuială"))+'</span>' +
        '<span class="sub">'+esc(x.cat||"Altele")+' · '+dLabel(x.date)+'</span></div>' +
        '<span class="amt" style="'+(inc?"color:var(--good)":"")+'">'+(inc?"+":"−")+money(num(x.amount)).replace("−","")+'</span>' +
        '<button class="icon-btn del" data-a="fdel" data-i="'+x.id+'" aria-label="Șterge">'+svg("trash")+'</button></div>';
    }).join("") + '</div>';
  }
  return h;
}
</script>

<script>
"use strict";

/* ══════════ Datorii ══════════ */
function viewDebts(m){
  const all = Object.keys(state.debts).map(id => Object.assign({id}, state.debts[id]));
  const active = all.filter(d => remaining(d) > 0).sort((a,b) => (a.due||"9999").localeCompare(b.due||"9999"));
  const closed = all.filter(d => remaining(d) <= 0);
  const left = active.reduce((s,d) => s + remaining(d), 0);
  const total = all.reduce((s,d) => s + num(d.total), 0);
  const paid = all.reduce((s,d) => s + paidOf(d), 0);

  let h = head(m.name, "Fiecare plată se scade din rest. Vezi mereu cât mai ai de dat.",
    '<button class="btn" data-a="dadd">'+svg("plus")+'Datorie nouă</button>');

  if(all.length) h += '<div class="tiles">' +
    tile("Rest de plată", money(left), active.length + (active.length===1?" datorie activă":" datorii active"), left ? "bad" : "good", true) +
    tile("Achitat", money(paid), total ? Math.round(paid/total*100) + "% din total" : "") +
    tile("Total contractat", money(total), all.length + (all.length===1?" datorie":" datorii")) +
    '</div>';

  h += sec("Active");
  if(!active.length){
    h += '<div class="empty"><h3>'+(all.length ? "Nicio datorie activă — toate achitate" : "Nicio datorie înregistrată")+'</h3>' +
      '<p>'+(all.length ? "Felicitări. Când apare una nouă, o adaugi aici." : "Adaugă o datorie cu suma totală și scadența. Pe măsură ce plătești, înregistrezi plățile și vezi cât ți-a mai rămas.")+'</p>' +
      '<button class="btn" data-a="dadd">'+svg("plus")+'Adaugă o datorie</button>' +
      (all.length ? '' : '<div class="demo"><span class="demo-tag">Exemplu — așa va arăta</span><div class="rows">' +
      '<div class="row"><span class="stripe warn"></span><div class="main"><span class="ttl">Credit auto</span>' +
      '<span class="sub">achitat 4.500 din 12.000 · scadent în 34 zile</span>' +
      '<div class="prog" style="margin-top:6px;max-width:280px"><i class="warn" style="width:37%"></i></div></div>' +
      '<span class="amt">'+money(7500)+'</span></div></div></div>') + '</div>';
  } else {
    h += '<div class="rows">' + active.map(d => {
      const rem = remaining(d), pct = num(d.total) ? paidOf(d)/num(d.total)*100 : 0;
      const n = d.due ? daysTo(d.due) : null;
      const cls = n === null ? "" : n < 0 ? "bad" : n <= 14 ? "warn" : "good";
      const when = n === null ? "fără scadență" : n < 0 ? "restanță de " + zile(Math.abs(n)) : n === 0 ? "scadent azi" : "scadent în " + zile(n);
      return '<div class="row"><span class="stripe '+cls+'"></span>' +
        '<div class="main"><span class="ttl">'+esc(d.name)+'</span>' +
        '<span class="sub">achitat '+money(paidOf(d))+' din '+money(num(d.total))+' · '+when+'</span>' +
        '<div class="prog" style="margin-top:6px;max-width:280px"><i class="'+(cls||"")+'" style="width:'+pct+'%"></i></div></div>' +
        '<span class="amt">'+money(rem)+'</span>' +
        '<button class="btn ghost sm" data-a="dpay" data-i="'+d.id+'">Plată</button>' +
        '<button class="icon-btn del" data-a="ddel" data-i="'+d.id+'" aria-label="Șterge">'+svg("trash")+'</button></div>';
    }).join("") + '</div>';
  }

  if(closed.length){
    h += sec("Achitate");
    h += '<div class="rows">' + closed.map(d =>
      '<div class="row"><span class="stripe good"></span><div class="main"><span class="ttl">'+esc(d.name)+'</span>' +
      '<span class="sub">achitat integral · '+money(num(d.total))+'</span></div><span class="pill good">gata</span>' +
      '<button class="icon-btn del" data-a="ddel" data-i="'+d.id+'" aria-label="Șterge">'+svg("trash")+'</button></div>').join("") + '</div>';
  }
  return h;
}

/* ══════════ Task-uri ══════════ */
function taskRow(t){
  const late = !t.done && t.due && t.due < today();
  const soon = !t.done && t.due === today();
  return '<div class="row '+(t.done?"done":"")+'">' +
    '<button class="chk '+(t.done?"on":"")+'" data-a="tdone" data-i="'+t.id+'" aria-label="Bifează">'+svg("check")+'</button>' +
    '<div class="main"><span class="ttl">'+esc(t.title)+'</span>' +
    (t.due||t.proj ? '<span class="sub">'+(t.proj?'<span class="pill">'+esc(t.proj)+'</span>':'') +
      (t.due?'<span class="'+(late?"pill bad":soon?"pill warn":"")+'">'+(late?"restant ":"")+dLabel(t.due)+'</span>':'')+'</span>' : '') +
    '</div>' +
    '<button class="icon-btn del" data-a="tdel" data-i="'+t.id+'" aria-label="Șterge">'+svg("trash")+'</button></div>';
}
function viewTasks(m){
  const all = itemsOf("tasks", m.id);
  const open = all.filter(t => !t.done), done = all.filter(t => t.done);
  const f = ui.taskFilter;
  let list = f === "open" ? open : f === "done" ? done : all;
  list = list.slice().sort((a,b) => {
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    const ad = a.due || "9999-99-99", bd = b.due || "9999-99-99";
    return ad === bd ? (b.createdAt||"").localeCompare(a.createdAt||"") : ad.localeCompare(bd);
  });

  let h = head(m.name, open.length ? open.length + (open.length===1?" lucru de făcut":" lucruri de făcut") : "Totul bifat.",
    '<button class="btn" data-a="tadd" data-m="'+m.id+'">'+svg("plus")+'Task nou</button>');

  h += '<div class="bar"><div class="seg">' +
    ['open','all','done'].map(x => '<button data-a="tfilter" data-i="'+x+'" class="'+(f===x?"on":"")+'">'+
      (x==="open"?"De făcut":x==="all"?"Toate":"Gata")+' '+(x==="open"?open.length:x==="all"?all.length:done.length)+'</button>').join("") +
    '</div><div class="grow"></div>' +
    (done.length ? '<button class="btn ghost sm" data-a="tclear" data-m="'+m.id+'">Curăță bifate ('+done.length+')</button>' : '') + '</div>';

  if(!list.length){
    h += '<div class="empty"><h3>'+(f==="done"?"Niciun task bifat încă":all.length?"Nimic aici":"Listă goală")+'</h3>' +
      '<p>'+(all.length?"Schimbă filtrul de mai sus ca să vezi restul.":"Scrie primul task. Poți să-i pui o scadență și un proiect, ca să știi ce e urgent.")+'</p>' +
      (all.length?'':'<button class="btn" data-a="tadd" data-m="'+m.id+'">'+svg("plus")+'Adaugă primul task</button>' +
      '<div class="demo"><span class="demo-tag">Exemplu — așa va arăta</span><div class="rows">' +
      '<div class="row"><span class="chk"></span><div class="main"><span class="ttl">Trimis factura pe septembrie</span><span class="sub"><span class="pill">personal</span><span class="pill warn">azi</span></span></div></div>' +
      '<div class="row done"><span class="chk on">'+svg("check")+'</span><div class="main"><span class="ttl">Programare la dentist</span></div></div>' +
      '</div></div>') + '</div>';
  } else h += '<div class="rows">' + list.map(taskRow).join("") + '</div>';
  return h;
}

/* ══════════ Obiceiuri ══════════ */
function viewHabits(m){
  const hs = itemsOf("habits", m.id).sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
  const span = isPhone() ? 7 : 21;
  const days = []; const d = new Date();
  for(let i = span-1; i >= 0; i--){ const x = new Date(d); x.setDate(x.getDate()-i); days.push(iso(x)); }
  const tod = today();

  let h = head(m.name, "Bifele stau înăuntrul obiceiului — 10 ani de bifat zilnic ocupă tot o singură fișă.",
    '<button class="btn" data-a="hadd" data-m="'+m.id+'">'+svg("plus")+'Obicei nou</button>');

  if(!hs.length){
    return h + '<div class="empty"><h3>Niciun obicei urmărit</h3>' +
      '<p>Alege lucrurile pe care vrei să le faci zilnic. Bifezi un pătrat pe zi și vezi seria crescând.</p>' +
      '<button class="btn" data-a="hadd" data-m="'+m.id+'">'+svg("plus")+'Adaugă primul obicei</button>' +
      '<div class="demo"><span class="demo-tag">Exemplu — așa va arăta</span><div class="rows"><div class="row">' +
      '<div class="main"><span class="ttl">Mișcare 30 min</span></div><div class="hgrid">' +
      [1,1,0,1,1,1,1,0,1,1,1,1,1,0].map(v => '<span class="hcell '+(v?"on":"")+'"></span>').join("") +
      '</div><span class="streak">5 zile</span></div></div></div></div>';
  }

  h += '<div class="card pad" style="overflow-x:auto"><div style="display:flex;flex-direction:column;gap:18px;min-width:'+(isPhone()?0:520)+'px">' +
    hs.map(hb => {
      const log = hb.log || {}, s = streak(hb);
      const doneN = days.filter(x => log[x]).length;
      return '<div class="hrow">' +
        '<div class="hname"><b>'+esc(hb.name)+'</b>' +
        '<em>'+doneN+' din ultimele '+zile(span)+'</em></div>' +
        '<div><div class="hgrid">' + days.map(x =>
          '<button class="hcell '+(log[x]?"on":"")+(x===tod?" today":"")+'" data-a="tick" data-i="'+hb.id+'" data-d="'+x+'" title="'+dLabel(x)+'" aria-label="'+esc(hb.name)+' — '+dLabel(x)+'"></button>').join("") +
        '</div><div class="hlabels">' + days.map(x => {
          const dd = new Date(x+"T12:00:00");
          const show = span <= 10 || dd.getDate() === 1 || x === days[0];
          return '<em>'+(show ? dd.getDate() : "")+'</em>';
        }).join("") + '</div></div>' +
        '<span class="streak" style="min-width:56px;text-align:right">'+zile(s)+'</span>' +
        '<button class="icon-btn del" data-a="hdel" data-i="'+hb.id+'" aria-label="Șterge">'+svg("trash")+'</button></div>';
    }).join("") + '</div></div>';
  return h;
}

/* ══════════ Notițe / Jurnal ══════════ */
function viewNotes(m){
  const q = (ui.search||"").toLowerCase();
  const all = itemsOf("notes", m.id).sort((a,b) => (b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""));
  const list = q ? all.filter(n => ((n.title||"") + " " + (n.body||"")).toLowerCase().includes(q)) : all;

  let h = head(m.name, all.length ? all.length + (all.length===1?" însemnare":" însemnări") : "Gânduri, idei, jurnal.",
    '<button class="btn" data-a="nadd" data-m="'+m.id+'">'+svg("plus")+'Însemnare nouă</button>');

  if(all.length) h += '<div class="bar"><div class="grow"><input type="text" id="q" placeholder="Caută în însemnări…" value="'+esc(ui.search)+'"></div>' +
    (q ? '<span class="pill">'+list.length+' rezultate</span>' : '') + '</div>';

  if(!list.length){
    h += '<div class="empty"><h3>'+(q?"Niciun rezultat pentru „"+esc(ui.search)+"”":"Nicio însemnare")+'</h3>' +
      '<p>'+(q?"Încearcă alt cuvânt.":"Scrie ce ai în cap. Se caută după titlu și conținut, oricât de multe aduni.")+'</p>' +
      (q?'':'<button class="btn" data-a="nadd" data-m="'+m.id+'">'+svg("plus")+'Scrie prima însemnare</button>' +
      '<div class="demo"><span class="demo-tag">Exemplu — așa va arăta</span><div class="notes"><div class="note">' +
      '<time>3 septembrie</time><h4>Idei pentru trimestrul următor</h4>' +
      '<p>Trei direcții de testat: pachet lunar pentru clienții vechi, o pagină de prezentare mai scurtă, și un follow-up automat la 7 zile.</p>' +
      '</div></div></div>') + '</div>';
  } else {
    h += '<div class="notes">' + list.map(n =>
      '<button class="note" data-a="nopen" data-i="'+n.id+'">' +
      '<time>'+dLabel((n.updatedAt||n.createdAt||"").slice(0,10))+'</time>' +
      '<h4>'+esc(n.title || "Fără titlu")+'</h4>' +
      (n.body ? '<p>'+esc(n.body)+'</p>' : '') + '</button>').join("") + '</div>';
  }
  return h;
}

/* ══════════ Goals ══════════ */
function viewGoals(m){
  const all = goalsAll().filter(g => (g.mod||"goals") === m.id)
    .sort((x,y) => (y.main?1:0)-(x.main?1:0) || (x.createdAt||"").localeCompare(y.createdAt||""));
  const anc = anchors(), ancIds = anc.map(g => g.id);

  let h = head(m.name, "Țintele în jurul cărora se învârte tot. Apar pe fiecare ecran.",
    '<button class="btn" data-a="gadd" data-m="'+m.id+'">'+svg("plus")+'Obiectiv nou</button>');

  if(!all.length){
    return h + '<div class="empty"><h3>Niciun obiectiv stabilit</h3>' +
      '<p>Un obiectiv e ori o sumă de strâns, ori o măsurătoare care trebuie să se miște. Alege tipul și aplicația calculează singură ritmul și în ce lună ajungi.</p>' +
      '<button class="btn" data-a="gadd" data-m="'+m.id+'">'+svg("plus")+'Stabilește primul obiectiv</button></div>';
  }

  h += goalHeroes(true);

  /* obiceiurile care alimentează fiecare ancoră */
  const habits = Object.keys(state.habits).map(id => Object.assign({id}, state.habits[id]));
  if(habits.length){
    anc.forEach(g => {
      h += sec("Obiceiuri care duc la „" + g.name + "”");
      h += '<div class="card pad" style="display:flex;gap:8px;flex-wrap:wrap">' + habits.map(hb => {
        const on = (g.habits||[]).includes(hb.id);
        return '<button class="chip'+(on?" on":"")+'" data-a="gtog" data-i="'+g.id+'" data-c="'+hb.id+'">'+esc(hb.name)+'</button>';
      }).join("") + '</div>';
    });
  }

  const rest = all.filter(g => !ancIds.includes(g.id));
  if(rest.length){
    h += sec("Celelalte obiective");
    h += rest.map(g => {
      const cur = gCur(g), pct = gPct(g), st = goalStatus(g, false), ready = gHasTarget(g);
      const last = (gKind(g)==="sum" ? (g.contrib||[]) : (g.reads||[])).slice()
        .sort((x,y) => (y.date||"").localeCompare(x.date||"")).slice(0,3);
      return '<div class="goal-card" style="margin-bottom:12px">' +
        '<div class="goal-head"><h4>'+esc(g.name)+'</h4>' +
        (st?'<span class="pill '+st.cls+'">'+st.txt+'</span>':'') +
        (g.due?'<span class="pill">'+dLabel(g.due)+'</span>':'') + '</div>' +
        (ready ? '<div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">' +
          '<span class="num" style="font-size:21px;font-weight:600">'+gFmt(g, cur)+'</span>' +
          '<span style="font-size:13px;color:var(--ink-2)">'+(gKind(g)==="sum"?"din ":"→ ")+gFmt(g, num(g.target))+'</span>' +
          '<span class="num" style="margin-left:auto;font-weight:600;color:var(--accent-ink)">'+pct.toFixed(pct<10?1:0)+'%</span></div>' +
          '<div class="prog" style="height:7px"><i style="width:'+Math.max(pct,0.8)+'%"></i></div>' +
          '<div class="hero-facts">' + goalFacts(g, false).map(f => '<div><b>'+f.v+'</b><span>'+esc(f.k)+'</span></div>').join("") + '</div>'
          : '<p style="margin:0;font-size:13.5px;color:var(--ink-2)">Fără țintă stabilită încă.</p>') +
        (last.length ? '<div style="display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:9px">' +
          '<span style="font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px">' +
          (gKind(g)==="sum" ? "Ultimele contribuții" : "Ultimele măsurători") + '</span>' +
          last.map(c => '<div style="display:flex;align-items:center;gap:10px;font-size:13.5px">' +
            '<span style="flex:1;min-width:0;overflow-wrap:anywhere">'+esc(c.note || (gKind(g)==="sum"?"Contribuție":"Măsurătoare"))+'</span>' +
            '<span style="color:var(--ink-3);font-size:12.5px;white-space:nowrap">'+dLabel(c.date)+'</span>' +
            '<span class="num" style="font-weight:600;white-space:nowrap">'+(gKind(g)==="sum" ? '+'+money(num(c.amount)) : gFmt(g, num(c.value)))+'</span>' +
            '<button class="icon-btn del" data-a="gundo" data-i="'+g.id+'" data-c="'+c.id+'" aria-label="Șterge">'+svg("trash")+'</button></div>').join("") +
          '</div>' : '') +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn sm" data-a="'+(gKind(g)==="sum"?"gcon":"gread")+'" data-i="'+g.id+'">'+svg("plus")+(gKind(g)==="sum"?"Contribuție":"Măsurătoare")+'</button>' +
        '<button class="btn ghost sm" data-a="gmain" data-i="'+g.id+'">Fă-l ancoră</button>' +
        '<button class="btn ghost sm" data-a="gedit" data-i="'+g.id+'">Modifică</button>' +
        '<button class="icon-btn del" style="margin-left:auto" data-a="gdel" data-i="'+g.id+'" aria-label="Șterge">'+svg("trash")+'</button>' +
        '</div></div>';
    }).join("");
  }
  return h;
}

/* ══════════ Setări ══════════ */
function viewSettings(){
  const n = Store.count(), pct = n/5000*100;
  const cloud = Store.mode === "cloud";
  let h = head("Setări", "Moneda, spațiul ocupat și exportul datelor tale.");

  h += '<div class="grid2">';
  h += '<div class="card pad"><label class="fld"><span>Monedă</span><select id="cur">' +
    Object.keys(CURRENCIES).map(c => '<option value="'+c+'"'+(state.settings.currency===c?" selected":"")+'>'+CURRENCIES[c]+'</option>').join("") +
    '</select></label><p style="margin:9px 0 0;font-size:13px;color:var(--ink-3)">Se schimbă peste tot instant. Sumele deja scrise rămân aceleași cifre.</p></div>';

  const ls = limits(), worst = ls.slice().sort((a,c) => c.pct - a.pct)[0];
  h += '<div class="card pad"><div style="font-size:13.5px;color:var(--ink-2)">'+
    (worst.pct < 60 ? "Toate limitele sunt departe. La ritmul obișnuit, ai loc pentru ani buni."
     : worst.pct < 75 ? "Cea mai apăsată limită e la " + worst.pct.toFixed(0) + "%. Încă e bine, dar ține un ochi pe ea."
     : worst.pct < 90 ? "Te apropii de o limită. Exportă și curăță ce nu-ți mai trebuie."
     : "Aproape plin. Exportă acum, apoi șterge — altfel salvările încep să eșueze.")+
    '</div></div>';
  h += '</div>';

  h += sec("Limite");
  h += '<div class="card pad">' + ls.map(l =>
    '<div class="lim"><div class="lim-t"><b>'+esc(l.label)+(l.detail?' <span style="font-weight:400;color:var(--ink-3)">· '+esc(l.detail)+'</span>':'')+'</b>' +
    '<span'+(l.pct>=90?' style="color:var(--bad)"':l.pct>=75?' style="color:var(--warn)"':'')+'>'+esc(l.show)+' · '+l.pct.toFixed(l.pct<1?1:0)+'%</span></div>' +
    '<div class="gauge-bar"><i style="width:'+Math.max(1.5,l.pct)+'%;background:'+(l.pct>=90?'var(--bad)':l.pct>=75?'var(--warn)':'var(--accent)')+'"></i></div>' +
    '<p>'+esc(l.why)+' <b style="font-weight:600;color:var(--ink-2)">'+esc(l.fix)+'</b></p></div>').join("") +
    (cloud ? '<p style="margin:14px 0 0;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);line-height:1.5">' +
      'Există și o a treia limită — spațiul din browser — dar apare doar când folosești aplicația fără sincronizare. ' +
      'Fiind sincronizat, datele tale stau pe server, deci nu te privește.</p>' : '') + '</div>';

  h += sec("Datele tale");
  h += '<div class="card pad" style="display:flex;flex-direction:column;gap:14px">' +
    '<div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:220px"><b style="display:block;margin-bottom:3px">Unde stau acum</b>' +
    '<span style="font-size:13.5px;color:var(--ink-2)">'+(Store.mode === "state"
      ? "În baza ta de date, prin state-api. Sertar propriu — nu atinge datele celeilalte aplicații."
      : cloud ? "În cloud, legate de contul tău. Le vezi de pe telefon și de pe laptop, aceleași."
      : (Store.err ? "Cloud-ul n-a răspuns ("+esc(Store.err)+"). " : "") +
        "Doar în acest browser, pe acest aparat — exportă des.")+'</span></div>' +
    '<span class="pill '+(Store.mode==="state"||cloud?"good":"warn")+'">'+
      (Store.mode==="state"?"cloud propriu":cloud?"sincronizat":"local")+'</span></div>' +
    (Store.mode === "state" || Store.err ? '<div style="height:1px;background:var(--line)"></div>' +
      '<div><b style="display:block;margin-bottom:3px">Cod de sincronizare</b>' +
      '<span style="display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:9px">' +
      'Pune același cod pe telefon și pe laptop ca să vezi aceleași date. Îl copiezi de pe aparatul pe care ai datele.</span>' +
      '<input type="text" id="tok" value="'+esc(Cloud.token)+'" spellcheck="false" autocomplete="off">' +
      '<div style="margin-top:9px"><button class="btn sm" data-a="settok">Salvează codul</button></div></div>' : '') +
    '<div style="height:1px;background:var(--line)"></div>' +
    '<div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:220px"><b style="display:block;margin-bottom:3px">Export</b>' +
    '<span style="font-size:13.5px;color:var(--ink-2)">Descarci tot — finanțe, datorii, task-uri, obiceiuri, notițe — într-un fișier pe care îl păstrezi tu. Fă-o din când în când.</span></div>' +
    '<button class="btn" data-a="export">'+svg("down")+'Exportă tot</button></div></div>';

  h += sec("Module");
  const custom = modules().filter(m => !m.builtin);
  h += '<div class="rows">' + modules().map(m =>
    '<div class="row">'+svg(m.kind)+'<div class="main"><span class="ttl">'+esc(m.name)+'</span>' +
    '<span class="sub">'+KINDS[m.kind].label+(m.builtin?" · inclus":"")+'</span></div>' +
    (m.builtin ? '<span class="pill">inclus</span>'
      : '<button class="icon-btn del" data-a="mdel" data-i="'+m.id+'" aria-label="Șterge modulul">'+svg("trash")+'</button>')+'</div>').join("") + '</div>';
  h += '<div style="margin-top:12px"><button class="btn ghost" data-a="newmod">'+svg("plus")+'Modul nou</button>' +
    (custom.length ? '' : '<span style="margin-left:12px;font-size:13px;color:var(--ink-3)">Poți adăuga oricâte module vrei: liste, notițe sau trackere.</span>')+'</div>';
  return h;
}
</script>

<script>
"use strict";

/* ══════════ Ferestre ══════════ */
let closeModal = () => {};
function modal(o){
  const layer = $("#layer");
  const fields = (o.fields||[]).map(f => {
    const v = esc(f.value == null ? "" : f.value);
    let inp;
    if(f.type === "select") inp = '<select name="'+f.k+'">' + f.options.map(x => {
        const val = typeof x === "string" ? x : x.v, lab = typeof x === "string" ? x : x.l;
        return '<option value="'+esc(val)+'"'+(String(f.value)===String(val)?" selected":"")+'>'+esc(lab)+'</option>';
      }).join("") + '</select>';
    else if(f.type === "textarea") inp = '<textarea name="'+f.k+'" placeholder="'+esc(f.ph||"")+'">'+v+'</textarea>';
    else inp = '<input type="'+(f.type||"text")+'" name="'+f.k+'" value="'+v+'" placeholder="'+esc(f.ph||"")+'"'+(f.type==="number"?' step="0.01" inputmode="decimal"':"")+'>';
    return '<label class="fld"><span>'+esc(f.label)+'</span>'+inp+'</label>';
  }).join("");
  layer.innerHTML = '<div class="veil" data-veil><form class="modal" autocomplete="off">' +
    '<header><h3>'+esc(o.title)+'</h3></header>' +
    '<div class="body">'+(o.note?'<p style="margin:0;font-size:13.5px;color:var(--ink-2)">'+o.note+'</p>':"")+fields+'</div>' +
    '<footer><button type="button" class="btn ghost" data-cancel>Renunță</button>' +
    '<button type="submit" class="btn'+(o.danger?" danger":"")+'">'+esc(o.ok||"Salvează")+'</button></footer></form></div>';
  const form = layer.querySelector("form");
  const first = form.querySelector("input,select,textarea");
  if(first) setTimeout(() => { first.focus(); if(first.select) first.select(); }, 40);
  closeModal = () => { layer.innerHTML = ""; closeModal = () => {}; };
  layer.querySelector("[data-cancel]").onclick = closeModal;
  layer.querySelector("[data-veil]").onclick = e => { if(e.target.hasAttribute("data-veil")) closeModal(); };
  form.onsubmit = e => {
    e.preventDefault();
    const v = {};
    new FormData(form).forEach((val,k) => v[k] = typeof val === "string" ? val.trim() : val);
    const err = o.onOk(v);
    if(err) toast(err); else closeModal();
  };
}
function ask(title, note, okLabel, fn){
  modal({title, note, ok:okLabel, danger:true, fields:[], onOk:() => { fn(); }});
}

/* ══════════ Acțiuni ══════════ */
const ACT = {
  go(el){ closeModal(); state.view = el.dataset.i; ui.search = ""; render(); window.scrollTo(0,0); },
  more(){
    const layer = $("#layer"), ms = modules();
    layer.innerHTML = '<div class="veil" data-veil><div class="modal">' +
      '<header><h3>Toate modulele</h3></header><div class="body" style="gap:3px">' +
      ms.map(m => '<button class="sheet-i '+(state.view===m.id?"on":"")+'" data-a="go" data-i="'+m.id+'">'+svg(m.kind)+'<span>'+esc(m.name)+'</span></button>').join("") +
      '<div style="height:1px;background:var(--line);margin:7px 0"></div>' +
      '<button class="sheet-i" data-a="newmod">'+svg("plus")+'<span>Modul nou</span></button>' +
      '<button class="sheet-i '+(state.view==="__set"?"on":"")+'" data-a="go" data-i="__set">'+svg("settings")+'<span>Setări</span></button>' +
      '</div><footer><button type="button" class="btn ghost" data-cancel>Închide</button></footer></div></div>';
    closeModal = () => { layer.innerHTML = ""; closeModal = () => {}; };
    layer.querySelector("[data-cancel]").onclick = closeModal;
    layer.querySelector("[data-veil]").onclick = e => { if(e.target.hasAttribute("data-veil")) closeModal(); };
  },

  /* module */
  newmod(){
    modal({title:"Modul nou", note:"Alege ce fel de modul vrei. Apare imediat în bara laterală.",
      fields:[
        {k:"name", label:"Nume", ph:"ex: Sănătate, Rețete, Clienți"},
        {k:"kind", label:"Tip", type:"select", value:"tasks", options:[
          {v:"tasks", l:"Listă de bifat — lucruri de făcut"},
          {v:"notes", l:"Notițe — text liber, cu căutare"},
          {v:"habits", l:"Tracker — bifezi zilnic, vezi seria"},
          {v:"goals",  l:"Obiective — ținte cu progres și termen"}]}
      ],
      onOk(v){
        if(!v.name) return "Dă-i un nume modulului.";
        const id = "m" + uid();
        Store.put("modules", id, {name:v.name, kind:v.kind, createdAt:new Date().toISOString()});
        state.view = id; toast("Modulul „" + v.name + "” a fost creat.");
      }});
  },
  mdel(el){
    const id = el.dataset.i, m = modById(id); if(!m) return;
    const n = itemsOf("tasks",id).length + itemsOf("notes",id).length + itemsOf("habits",id).length + itemsOf("goals",id).length;
    ask("Ștergi modulul „" + m.name + "”?",
      n ? "Se șterg și cele <b>" + n + "</b> lucruri dinăuntru. Nu se poate anula." : "Modulul e gol. Nu se poate anula.",
      "Șterge modulul", () => {
        ["tasks","notes","habits","goals"].forEach(c => itemsOf(c,id).forEach(x => Store.drop(c, x.id)));
        Store.drop("modules", id);
        if(state.view === id) state.view = "azi";
        toast("Modul șters.");
      });
  },

  /* finanțe */
  fprev(){ const d = new Date(ui.month+"-01T12:00:00"); d.setMonth(d.getMonth()-1); ui.month = iso(d).slice(0,7); render(); },
  fnext(){ const d = new Date(ui.month+"-01T12:00:00"); d.setMonth(d.getMonth()+1); ui.month = iso(d).slice(0,7); render(); },
  fnow(){ ui.month = ym(); render(); },
  fadd(){
    modal({title:"Mișcare nouă",
      fields:[
        {k:"type", label:"Fel", type:"select", value:"out", options:[{v:"out",l:"Cheltuială"},{v:"in",l:"Venit"}]},
        {k:"amount", label:"Sumă", type:"number", ph:"0.00"},
        {k:"cat", label:"Categorie", type:"select", value:"Altele", options:CATS_OUT.concat(CATS_IN.filter(c => !CATS_OUT.includes(c)))},
        {k:"date", label:"Data", type:"date", value:ui.month === ym() ? today() : ui.month + "-01"},
        {k:"note", label:"Descriere", ph:"ex: cumpărături, factură client"}
      ],
      onOk(v){
        const a = num(v.amount);
        if(a <= 0) return "Scrie o sumă mai mare ca zero.";
        if(!v.date) return "Alege data.";
        const k = ym(v.date);
        const cur = (state.finance[k] || {}).items || [];
        Store.put("finance", k, {items: cur.concat([{id:uid(), date:v.date, type:v.type, amount:a, cat:v.cat, note:v.note}])});
        ui.month = k;
        toast(v.type === "in" ? "Venit adăugat." : "Cheltuială adăugată.");
      }});
  },
  fdel(el){
    const k = ui.month, id = el.dataset.i;
    const cur = ((state.finance[k]||{}).items || []).filter(x => x.id !== id);
    Store.put("finance", k, {items:cur}); toast("Mișcare ștearsă.");
  },

  /* datorii */
  dadd(){
    modal({title:"Datorie nouă",
      fields:[
        {k:"name", label:"Către cine / pentru ce", ph:"ex: Credit auto, împrumut Maria"},
        {k:"total", label:"Suma totală", type:"number", ph:"0.00"},
        {k:"paid", label:"Deja achitat (opțional)", type:"number", ph:"0.00"},
        {k:"due", label:"Scadență (opțional)", type:"date"}
      ],
      onOk(v){
        if(!v.name) return "Scrie pentru ce e datoria.";
        if(num(v.total) <= 0) return "Scrie suma totală.";
        const p = num(v.paid);
        Store.put("debts", "d" + uid(), {name:v.name, total:num(v.total), due:v.due||"",
          payments: p > 0 ? [{id:uid(), date:today(), amount:p}] : [], createdAt:new Date().toISOString()});
        toast("Datorie adăugată.");
      }});
  },
  dpay(el){
    const id = el.dataset.i, d = state.debts[id]; if(!d) return;
    const rem = remaining(d);
    modal({title:"Plată către „" + d.name + "”",
      note:"Rest de plată acum: <b>" + money(rem) + "</b>",
      fields:[{k:"amount", label:"Cât plătești", type:"number", value:rem.toFixed(2)}, {k:"date", label:"Data", type:"date", value:today()}],
      onOk(v){
        const a = num(v.amount);
        if(a <= 0) return "Scrie o sumă mai mare ca zero.";
        Store.put("debts", id, Object.assign({}, d, {payments:(d.payments||[]).concat([{id:uid(), date:v.date||today(), amount:a}])}));
        toast(a >= rem ? "Achitată integral. Bravo." : "Plată înregistrată. Mai ai " + money(rem - a) + ".");
      }});
  },
  ddel(el){
    const id = el.dataset.i, d = state.debts[id]; if(!d) return;
    ask("Ștergi „" + d.name + "”?", "Se pierde și istoricul plăților. Nu se poate anula.", "Șterge", () => { Store.drop("debts", id); toast("Datorie ștearsă."); });
  },

  /* task-uri */
  tadd(el){
    const mid = el.dataset.m;
    modal({title:"Task nou",
      fields:[
        {k:"title", label:"Ce ai de făcut", ph:"ex: trimis factura pe septembrie"},
        {k:"due", label:"Până când (opțional)", type:"date"},
        {k:"proj", label:"Proiect (opțional)", ph:"ex: casă, sănătate, personal"}
      ],
      onOk(v){
        if(!v.title) return "Scrie ce ai de făcut.";
        Store.put("tasks", "t" + uid(), {mod:mid, title:v.title, due:v.due||"", proj:v.proj||"", done:false, createdAt:new Date().toISOString()});
      }});
  },
  tdone(el){
    const id = el.dataset.i, t = state.tasks[id]; if(!t) return;
    Store.put("tasks", id, Object.assign({}, t, {done: !t.done, doneAt: !t.done ? new Date().toISOString() : ""}));
  },
  tdel(el){ Store.drop("tasks", el.dataset.i); },
  tfilter(el){ ui.taskFilter = el.dataset.i; render(); },
  tclear(el){
    const mid = el.dataset.m, done = itemsOf("tasks", mid).filter(t => t.done);
    ask("Ștergi cele " + done.length + " task-uri bifate?", "Dispar definitiv din listă. Nu se poate anula.", "Șterge tot",
      () => { done.forEach(t => Store.drop("tasks", t.id)); toast(done.length + " task-uri șterse."); });
  },

  /* obiective */
  gadd(el){
    const mid = el.dataset.m;
    modal({title:"Obiectiv nou",
      note:"O <b>sumă</b> se adună spre o țintă. O <b>măsurătoare</b> se mută de la o valoare la alta.",
      fields:[
        {k:"name", label:"Numele obiectivului", ph:"ex: 100k, six pack"},
        {k:"kind", label:"Fel", type:"select", value:"sum", options:[
          {v:"sum",    l:"Sumă de strâns — bani, contribuții"},
          {v:"metric", l:"Măsurătoare — kg, %, cm"}]},
        {k:"unit", label:"Unitate (doar la măsurătoare)", ph:"kg, %, cm"},
        {k:"start", label:"De la ce valoare pornești", type:"number", ph:"0"},
        {k:"target", label:"Ținta", type:"number", ph:"0"},
        {k:"due", label:"Până când (opțional)", type:"date"}
      ],
      onOk(v){
        if(!v.name) return "Dă-i un nume obiectivului.";
        if(v.target === "") return "Scrie ținta.";
        const st = num(v.start), tg = num(v.target);
        const g = {mod:mid, name:v.name, kind:v.kind, target:tg, due:v.due||"", main:true,
          habits:[], createdAt:new Date().toISOString()};
        if(v.kind === "metric"){
          if(st === tg) return "Ținta trebuie să fie diferită de valoarea de start.";
          g.unit = v.unit || ""; g.start = st;
          g.reads = [{id:uid(), date:today(), value:st, note:"Punct de pornire"}];
        } else {
          if(tg <= 0) return "Ținta trebuie să fie mai mare ca zero.";
          g.contrib = st > 0 ? [{id:uid(), date:today(), amount:st, note:"Punct de pornire"}] : [];
        }
        Store.put("goals", "g" + uid(), g);
        toast("Obiectiv stabilit. Îl vezi acum pe fiecare ecran.");
      }});
  },
  gcon(el){
    const id = el.dataset.i, g = state.goals[id]; if(!g) return;
    const rem = Math.max(0, num(g.target) - gCur(g));
    modal({title:"Contribuție la „" + g.name + "”",
      note:"Mai ai de strâns <b>" + money(rem) + "</b>.",
      fields:[{k:"amount", label:"Cât adaugi", type:"number", ph:"0.00"},
              {k:"date", label:"Data", type:"date", value:today()},
              {k:"note", label:"Din ce (opțional)", ph:"ex: economii septembrie"}],
      onOk(v){
        const a = num(v.amount);
        if(a <= 0) return "Scrie o sumă mai mare ca zero.";
        Store.put("goals", id, Object.assign({}, g, {contrib:(g.contrib||[]).concat([{id:uid(), date:v.date||today(), amount:a, note:v.note||""}])}));
        toast(a >= rem ? "Obiectiv atins. Felicitări." : "Adăugat. Mai ai " + money(rem - a) + ".");
      }});
  },
  gread(el){
    const id = el.dataset.i, g = state.goals[id]; if(!g) return;
    modal({title:"Măsurătoare — " + g.name,
      note: gHasTarget(g) ? "Acum: <b>" + gFmt(g, gCur(g)) + "</b> · ținta: <b>" + gFmt(g, num(g.target)) + "</b>" : "",
      fields:[{k:"value", label:"Valoarea de azi" + (gUnit(g) ? " (" + gUnit(g) + ")" : ""), type:"number", ph:"0"},
              {k:"date", label:"Data", type:"date", value:today()},
              {k:"note", label:"Observație (opțional)", ph:"ex: dimineața, pe nemâncate"}],
      onOk(v){
        if(v.value === "") return "Scrie valoarea măsurată.";
        const val = num(v.value);
        const reads = (g.reads||[]).filter(r => r.date !== (v.date||today()));
        Store.put("goals", id, Object.assign({}, g, {reads:reads.concat([{id:uid(), date:v.date||today(), value:val, note:v.note||""}])}));
        const rem = num(g.target) - val;
        toast(Math.abs(rem) < 0.05 ? "Ținta atinsă. Bravo." : "Notat. Mai ai " + gFmt(g, Math.abs(rem)) + ".");
      }});
  },
  gundo(el){
    const id = el.dataset.i, g = state.goals[id], cid = el.dataset.c; if(!g) return;
    const patch = gKind(g) === "sum"
      ? {contrib:(g.contrib||[]).filter(c => c.id !== cid)}
      : {reads:(g.reads||[]).filter(c => c.id !== cid)};
    Store.put("goals", id, Object.assign({}, g, patch));
    toast("Șters.");
  },
  gedit(el){
    const id = el.dataset.i, g = state.goals[id]; if(!g) return;
    const metric = gKind(g) === "metric";
    const f = [{k:"name", label:"Nume", value:g.name}];
    if(metric) f.push({k:"unit", label:"Unitate", value:gUnit(g), ph:"kg, %, cm"},
                      {k:"start", label:"Valoarea de plecare", type:"number", value:g.start === undefined ? "" : num(g.start)});
    f.push({k:"target", label:"Ținta", type:"number", value: gHasTarget(g) ? num(g.target) : ""},
           {k:"due", label:"Până când (opțional)", type:"date", value:g.due||""});
    modal({title:"Modifică „" + g.name + "”", fields:f,
      onOk(v){
        if(!v.name) return "Dă-i un nume.";
        if(v.target === "") return "Scrie ținta.";
        const patch = {name:v.name, target:num(v.target), due:v.due||""};
        if(metric){
          patch.unit = v.unit || "";
          patch.start = num(v.start);
          if(patch.start === patch.target) return "Ținta trebuie să fie diferită de valoarea de plecare.";
          if(!(g.reads||[]).length) patch.reads = [{id:uid(), date:today(), value:patch.start, note:"Punct de pornire"}];
        } else if(num(v.target) <= 0) return "Ținta trebuie să fie mai mare ca zero.";
        Store.put("goals", id, Object.assign({}, g, patch));
      }});
  },
  gtog(el){
    const id = el.dataset.i, g = state.goals[id], hid = el.dataset.c; if(!g) return;
    const cur = g.habits || [];
    Store.put("goals", id, Object.assign({}, g, {habits: cur.includes(hid) ? cur.filter(x => x !== hid) : cur.concat([hid])}));
  },
  gmain(el){
    const id = el.dataset.i, g = state.goals[id]; if(!g) return;
    Store.put("goals", id, Object.assign({}, g, {main: !g.main}));
    toast(g.main ? "Scos dintre ancore." : "Devine ancoră — apare pe toate ecranele.");
  },
  gdel(el){
    const id = el.dataset.i, g = state.goals[id]; if(!g) return;
    ask("Ștergi „" + g.name + "”?", "Se pierde și tot istoricul. Nu se poate anula.", "Șterge",
      () => { Store.drop("goals", id); toast("Obiectiv șters."); });
  },

  /* obiceiuri */
  hadd(el){
    const mid = el.dataset.m;
    modal({title:"Obicei nou", note:"Ceva ce vrei să faci în fiecare zi.",
      fields:[{k:"name", label:"Numele obiceiului", ph:"ex: mișcare 30 min, citit, 2L apă"}],
      onOk(v){
        if(!v.name) return "Dă-i un nume.";
        Store.put("habits", "h" + uid(), {mod:mid, name:v.name, log:{}, createdAt:new Date().toISOString()});
      }});
  },
  tick(el){
    const id = el.dataset.i, d = el.dataset.d, hb = state.habits[id]; if(!hb) return;
    const log = Object.assign({}, hb.log || {});
    if(log[d]) delete log[d]; else log[d] = 1;
    Store.put("habits", id, Object.assign({}, hb, {log}));
  },
  hdel(el){
    const id = el.dataset.i, hb = state.habits[id]; if(!hb) return;
    ask("Ștergi „" + hb.name + "”?", "Se pierde tot istoricul de bife. Nu se poate anula.", "Șterge", () => Store.drop("habits", id));
  },

  /* notițe */
  nadd(el){
    const mid = el.dataset.m;
    modal({title:"Însemnare nouă",
      fields:[{k:"title", label:"Titlu", ph:"despre ce e"}, {k:"body", label:"Conținut", type:"textarea", ph:"scrie liber…"}],
      onOk(v){
        if(!v.title && !v.body) return "Scrie măcar ceva.";
        const now = new Date().toISOString();
        Store.put("notes", "n" + uid(), {mod:mid, title:v.title, body:v.body, createdAt:now, updatedAt:now});
      }});
  },
  nopen(el){
    const id = el.dataset.i, n = state.notes[id]; if(!n) return;
    modal({title:"Însemnare", ok:"Salvează",
      fields:[{k:"title", label:"Titlu", value:n.title}, {k:"body", label:"Conținut", type:"textarea", value:n.body}],
      onOk(v){
        if(!v.title && !v.body){
          Store.drop("notes", id); toast("Însemnare goală — ștearsă."); return;
        }
        Store.put("notes", id, Object.assign({}, n, {title:v.title, body:v.body, updatedAt:new Date().toISOString()}));
      }});
    const f = $("#layer form");
    const del = document.createElement("button");
    del.type = "button"; del.className = "btn ghost"; del.style.marginRight = "auto"; del.textContent = "Șterge";
    del.onclick = () => { closeModal(); ask("Ștergi însemnarea?", "Nu se poate anula.", "Șterge", () => { Store.drop("notes", id); toast("Ștearsă."); }); };
    f.querySelector("footer").prepend(del);
  },

  /* cod de sincronizare */
  async settok(){
    const el = $("#tok"); if(!el) return;
    const t = el.value.trim();
    if(t.length < 16) return toast("Codul pare prea scurt. Copiază-l întreg.");
    Cloud.setToken(t);
    try{
      const d = await Cloud.load();
      if(d){
        COLLS.forEach(c => { if(c !== "settings" && d[c]) state[c] = d[c]; });
        if(d.settings) state.settings = Object.assign({currency:"£"}, d.settings);
        Store.saveLocal(); toast("Conectat. Datele au fost aduse.");
      } else {
        await Cloud.save(Store.snapshot()); toast("Conectat. Sertarul era gol — am urcat ce ai aici.");
      }
      Store.mode = "state"; Store.err = "";
    }catch(e){ Store.err = (e && e.message) || "eroare"; toast("Nu s-a conectat: " + Store.err); }
    paintMode(); render();
  },

  /* export */
  async export(){
    const data = {app:"Roberto OS", exportat:new Date().toISOString(), moneda:state.settings.currency};
    COLLS.forEach(c => { if(c !== "settings") data[c] = state[c]; });
    const txt = JSON.stringify(data, null, 2);
    const name = "roberto-os-" + today() + ".json";
    let dl = null;
    try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){}
    if(dl){
      try{
        const r = await dl.save({filename:name, data:txt});
        toast(r && r.status === "saved" ? "Exportat. Verifică descărcările." : "Trimis.");
        return;
      }catch(e){ if(e && e.code === "cancelled") return; }
    }
    modal({title:"Copiază datele", ok:"Am copiat",
      note:"Descărcarea directă nu e permisă aici. Selectează tot textul de mai jos și salvează-l într-un fișier <b>" + name + "</b>.",
      fields:[{k:"d", label:"Datele tale", type:"textarea", value:txt}],
      onOk(){}});
  }
};

/* ══════════ Evenimente ══════════ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if(!el) return;
  e.preventDefault();
  const fn = ACT[el.dataset.a];
  if(fn) fn(el);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
document.addEventListener("change", e => {
  if(e.target.id === "cur"){ Store.setSettings({currency:e.target.value}); toast("Moneda schimbată."); }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){
    const pos = e.target.selectionStart;
    ui.search = e.target.value; render();
    const nx = $("#q"); if(nx){ nx.focus(); try{ nx.setSelectionRange(pos,pos); }catch(err){} }
  }
});

/* ══════════ Pornire ══════════ */
let wasPhone = isPhone(), rz;
window.addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { if(isPhone() !== wasPhone){ wasPhone = isPhone(); render(); } }, 180);
});
render();
Store.init().then(() => { state.ready = true; render(); });
