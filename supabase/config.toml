# The local, ephemeral Supabase. CI brings it up, runs the RLS test and the
# layout check with real authentication, then shuts it down.
# It has nothing to do with the production database and does not know its URL.

project_id = "life-control-centre"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
shadow_port = 54320

[auth]
enabled = true
site_url = "http://127.0.0.1:4319"

# Email and password. No email confirmation locally, so the CI checks can sign
# in without a mailbox. In production this is a project setting, not a setting
# of this file.
[auth.email]
enabled = true
enable_signup = true
enable_confirmations = false
