# Supabase local, efemer. Se ridică în CI, rulează testul de RLS și
# verificarea așezării cu autentificare adevărată, apoi se stinge.
# Nu are nicio legătură cu baza de producție și nu-i știe URL-ul.

project_id = "life-control-centre"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
shadow_port = 54320

[auth]
enabled = true
site_url = "http://127.0.0.1:4319"

# Email și parolă. Fără confirmare pe email local, ca verificările din CI să
# poată intra în cont fără cutie poștală. În producție e o setare a
# proiectului, nu a fișierului ăsta.
[auth.email]
enabled = true
enable_signup = true
enable_confirmations = false
