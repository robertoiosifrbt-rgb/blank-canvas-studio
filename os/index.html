<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/GYM-APP/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Fundalul paginii, ca zona barei de status sa se contopeasca cu ea. -->
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gym App" />
    <!-- `default`, nu `black-translucent`: translucent ii spune iOS-ului sa deseneze
         pagina SUB bara de status, iar `env(safe-area-inset-top)` nu compenseaza
         de unul singur in aplicatia salvata pe ecranul principal. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Gym App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
