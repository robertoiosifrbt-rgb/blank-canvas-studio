<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACHU Business Hub</title>

    <!-- Sesiunea 35 (ACHU-235). The manifest is not decoration: on iPhone, Web
         Push works ONLY from an app added to the Home Screen, and without a
         manifest declaring display:standalone, iOS adds a Safari bookmark rather
         than an installed app — so notifications would never arrive there, with
         nothing anywhere to explain why. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#082fa6" />

    <!-- iOS ignores the manifest's icons for the Home Screen and uses this one. -->
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="icon" href="/icon-512.png" />
    <!-- Needed by older iOS to open standalone instead of in Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ACHU" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
