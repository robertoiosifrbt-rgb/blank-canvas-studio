name: Check module rules

on:
  push:
    branches: [main, roberto-os]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reguli de structură (CLAUDE.md)
        run: node scripts/check-modules.mjs
      - name: Sintaxă
        run: for f in $(find app -name '*.js'); do node --check "$f"; done
